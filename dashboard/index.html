
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Environmental Monitor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
    }
    main { max-width: 950px; margin: auto; }
    h1 { margin-bottom: 8px; }
    .muted { color: #94a3b8; }
    .status {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 20px;
      background: #334155;
      margin: 18px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 15px;
      border: 1px solid #334155;
    }
    .value { font-size: 42px; font-weight: bold; margin: 15px 0; }
    .history { margin-top: 22px; }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
    }
    input {
      padding: 10px;
      width: 260px;
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #64748b;
      background: #0f172a;
      color: white;
    }
    li { margin: 9px 0; color: #cbd5e1; }
  </style>
</head>
<body>
<main>
  <h1>Smart Environmental Monitor</h1>
  <p class="muted">Live IoT temperature and humidity monitoring</p>

  <div>
    <input id="broker" value="wss://test.mosquitto.org:8081"
      aria-label="MQTT broker WebSocket URL">
    <button id="connect">Connect</button>
  </div>

  <div class="status" id="status">Disconnected</div>

  <section class="grid">
    <div class="card">
      <p class="muted">Temperature</p>
      <div class="value" id="temperature">-- °C</div>
      <p class="muted">Latest sensor reading</p>
    </div>
    <div class="card">
      <p class="muted">Humidity</p>
      <div class="value" id="humidity">-- %</div>
      <p class="muted">Latest sensor reading</p>
    </div>
    <div class="card">
      <p class="muted">Messages received</p>
      <div class="value" id="messages">0</div>
      <p class="muted">MQTT messages</p>
    </div>
  </section>

  <section class="card history">
    <h2>Recent readings</h2>
    <ul id="history"><li>No readings received yet.</li></ul>
  </section>
</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
  const topic = "aadav/smart-monitor/telemetry";
  let client;
  let count = 0;

  const status = document.getElementById("status");
  const historyList = document.getElementById("history");

  document.getElementById("connect").addEventListener("click", () => {
    if (client) client.end(true);

    const broker = document.getElementById("broker").value.trim();
    status.textContent = "Connecting...";

    client = mqtt.connect(broker, {
      reconnectPeriod: 3000,
      connectTimeout: 10000
    });

    client.on("connect", () => {
      status.textContent = "Connected — listening for readings";
      client.subscribe(topic);
    });

    client.on("reconnect", () => {
      status.textContent = "Reconnecting...";
    });

    client.on("error", (error) => {
      status.textContent = "Connection error: " + error.message;
    });

    client.on("offline", () => {
      status.textContent = "Offline";
    });

    client.on("message", (receivedTopic, payload) => {
      try {
        const data = JSON.parse(payload.toString());
        if (typeof data.temperature !== "number" ||
            typeof data.humidity !== "number") return;

        document.getElementById("temperature").textContent =
          data.temperature.toFixed(1) + " °C";
        document.getElementById("humidity").textContent =
          data.humidity.toFixed(1) + " %";

        count++;
        document.getElementById("messages").textContent = count;

        const item = document.createElement("li");
        item.textContent =
          new Date().toLocaleTimeString() +
          " — " + data.temperature.toFixed(1) + " °C, " +
          data.humidity.toFixed(1) + " %";

        if (historyList.firstElementChild?.textContent ===
            "No readings received yet.") {
          historyList.innerHTML = "";
        }

        historyList.prepend(item);
        while (historyList.children.length > 10) {
          historyList.lastElementChild.remove();
        }
      } catch (error) {
        console.error("Invalid sensor message", error);
      }
    });
  });
</script>
</body>
</html>
